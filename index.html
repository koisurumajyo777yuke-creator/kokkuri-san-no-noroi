<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>コックリさんの呪い</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  background: #000;

  color: #fff;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Hiragino Kaku Gothic ProN",

    "Yu Gothic",

    sans-serif;

}

.screen {

  min-height: 100svh;

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

}

.screen.active {

  display: flex;

}

/* =========================

   タイトル画面

========================= */

#titleScreen {

  position: relative;

  overflow: hidden;

}

.title-image {

  width: 100%;

  height: 100svh;

  object-fit: contain;

  display: block;

}

.start-button {

  position: absolute;

  left: 50%;

  bottom: 8%;

  transform: translateX(-50%);

  padding: 15px 32px;

  border: 1px solid rgba(255,255,255,.75);

  border-radius: 8px;

  background: rgba(0,0,0,.72);

  color: #fff;

  font-size: 20px;

  font-weight: bold;

}

/* =========================

   注意画面

========================= */

#warningScreen {

  padding: 30px 24px;

  text-align: center;

}

.warning-box {

  width: min(100%, 520px);

  line-height: 1.9;

}

.warning-box h2 {

  margin-bottom: 28px;

}

.warning-box p {

  margin: 0 0 22px;

}

.warning-button {

  margin-top: 20px;

  padding: 15px 30px;

  border: 1px solid #aaa;

  border-radius: 8px;

  background: #181818;

  color: #fff;

  font-size: 18px;

}

/* =========================

   朝の学校

========================= */

#morningScreen {

  position: relative;

  overflow: hidden;

}

.morning-image {

  width: 100%;

  height: 100svh;

  object-fit: contain;

  display: block;

  background: #000;

}

</style>

</head>

<body>

<!-- タイトル -->

<section id="titleScreen" class="screen active">

  <img

    src="01_title.PNG"

    alt="学校の怪談シリーズ Ver.1 コックリさんの呪い"

    class="title-image"

  >

  <button

    class="start-button"

    onclick="showWarning()"

  >

    ゲームを始める

  </button>

</section>

<!-- 注意 -->

<section id="warningScreen" class="screen">

  <div class="warning-box">

    <h2>― ご注意 ―</h2>

    <p>

      このゲームはフィクションです。<br>

      作中には「コックリさん」を題材とした恐怖演出が登場します。

    </p>

    <p>

      実際にコックリさんを行ったり、真似したりしないでください。

    </p>

    <p>

      また、暗い画面演出・効果音・恐怖表現が含まれます。<br>

      苦手な方はご注意ください。

    </p>

    <p>

      覚悟を決めて、お進みください。

    </p>

    <button

      class="warning-button"

      onclick="startGame()"

    >

      ゲームを始める

    </button>

  </div>

</section>

<!-- 朝の学校 -->

<section id="morningScreen" class="screen">

  <img

    src="02_school_morning.PNG"

    alt="朝の学校"

    class="morning-image"
onclick="showShoebox()"
  >

</section>
<!-- 下駄箱 -->

<section id="shoeboxScreen" class="screen">

  <img

    src="03_shoebox.PNG"

    alt="朝の下駄箱"

    class="morning-image"

  >

</section>
<script>

function showWarning() {

  document

    .getElementById("titleScreen")

    .classList.remove("active");

  document

    .getElementById("warningScreen")

    .classList.add("active");

}

function startGame() {

  document

    .getElementById("warningScreen")

    .classList.remove("active");

  document

    .getElementById("morningScreen")

    .classList.add("active");

}
function showShoebox() {

  document.getElementById("morningScreen").classList.remove("active");

  document.getElementById("shoeboxScreen").classList.add("active");

}
</script>

</body>

</html>
