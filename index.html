<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>コックリさんの呪い</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  background: #000;

  color: #fff;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Hiragino Kaku Gothic ProN",

    "Yu Gothic",

    sans-serif;

}

.screen {

  min-height: 100svh;

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

}

.screen.active {

  display: flex;

}

/* タイトル */

#titleScreen {

  position: relative;

  overflow: hidden;

}

.title-image {

  width: 100%;

  height: 100svh;

  object-fit: contain;

  display: block;

}

.start-button {

  position: absolute;

  left: 50%;

  bottom: 8%;

  transform: translateX(-50%);

  padding: 15px 32px;

  border: 1px solid rgba(255,255,255,.75);

  border-radius: 8px;

  background: rgba(0,0,0,.72);

  color: #fff;

  font-size: 20px;

  font-weight: bold;

}

/* 注意画面 */

#warningScreen {

  padding: 30px 24px;

  text-align: center;

}

.warning-box {

  width: min(100%, 520px);

  line-height: 1.9;

}

.warning-box h2 {

  margin-bottom: 28px;

}

.warning-box p {

  margin: 0 0 22px;

}

.warning-button {

  margin-top: 20px;

  padding: 15px 30px;

  border: 1px solid #aaa;

  border-radius: 8px;

  background: #181818;

  color: #fff;

  font-size: 18px;

}

/* 画像確認画面 */

#gameScreen {

  position: relative;

  overflow: hidden;

  cursor: pointer;

}

.game-image {

  width: 100%;

  height: 100svh;

  object-fit: contain;

  display: block;

  background: #000;

}

.counter {

  position: absolute;

  top: 12px;

  right: 12px;

  padding: 6px 10px;

  border-radius: 6px;

  background: rgba(0,0,0,.65);

  color: #fff;

  font-size: 14px;

}

</style>

</head>

<body>

<!-- タイトル -->

<section id="titleScreen" class="screen active">

  <img

    src="01_title.PNG"

    alt="学校の怪談シリーズ Ver.1 コックリさんの呪い"

    class="title-image"

  >

  <button

    class="start-button"

    onclick="showWarning()"

  >

    ゲームを始める

  </button>

</section>

<!-- 注意 -->

<section id="warningScreen" class="screen">

  <div class="warning-box">

    <h2>― ご注意 ―</h2>

    <p>

      このゲームはフィクションです。<br>

      作中には「コックリさん」を題材とした恐怖演出が登場します。

    </p>

    <p>

      実際にコックリさんを行ったり、真似したりしないでください。

    </p>

    <p>

      また、暗い画面演出・効果音・恐怖表現が含まれます。<br>

      苦手な方はご注意ください。

    </p>

    <p>

      覚悟を決めて、お進みください。

    </p>

    <button

      class="warning-button"

      onclick="startGame()"

    >

      ゲームを始める

    </button>

  </div>

</section>

<!-- 画像確認 -->

<section id="gameScreen" class="screen" onclick="nextImage()">

  <img

    id="gameImage"

    src="02_school_morning.PNG"

    alt="ゲーム画像"

    class="game-image"

  >

  <div id="counter" class="counter">

    02 / 27

  </div>

</section>

<script>

const images = [

  "02_school_morning.PNG",

  "03_shoebox.PNG",

  "04_hallway.PNG",

  "05_stairs_day.PNG",

  "06_classroom_day.PNG",

  "07_artroom_day.PNG",

  "08_scienceroom_day.PNG",

  "09_musicroom_day.PNG",

  "10_kokkuri_day.PNG",

  "11_school_night.PNG",

  "12_kokkuri_night.PNG",

  "13_kokkuri_yes.PNG",

  "14_kokkuri_chi.PNG",

  "15_kokkuri_no.PNG",

  "16_toilet_night.PNG",

  "17_toilet_door.PNG",

  "18_stairs_night.PNG",

  "19_stairs_figure.PNG",

  "20_science_night.PNG",

  "21_skeleton_closeup.PNG",

  "22_music_night.PNG",

  "23_beethoven.PNG",

  "24_four_corners.PNG",

  "25_four_corners_dark.PNG",

  "26_final_yes_coin.PNG",

  "27_classroom_door.PNG"

];

let currentImage = 0;

function showWarning() {

  document

    .getElementById("titleScreen")

    .classList.remove("active");

  document

    .getElementById("warningScreen")

    .classList.add("active");

}

function startGame() {

  document

    .getElementById("warningScreen")

    .classList.remove("active");

  document

    .getElementById("gameScreen")

    .classList.add("active");

  showImage();

}

function showImage() {

  document.getElementById("gameImage").src =

    images[currentImage];

  const number =

    String(currentImage + 2).padStart(2, "0");

  document.getElementById("counter").textContent =

    number + " / 27";

}

function nextImage() {

  if (currentImage < images.length - 1) {

    currentImage++;

    showImage();

  }

}

</script>

</body>

</html>
